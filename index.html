<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Crypto Wallet</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Sans:wght@500;600;700&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Splash -->
  <div class="splash" id="splash" aria-label="Vero">
    <canvas id="fx"></canvas>
    <div class="logo">
      <div class="markwrap">
        <svg class="mark" viewBox="-6 -6 192 152" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5cff5c"/><stop offset="1" stop-color="#34d63a"/>
            </linearGradient>
          </defs>
          <g class="cap">
            <rect x="-75" y="-22" width="150" height="44" rx="22" transform="translate(65 48) rotate(-42)"/>
            <rect x="-75" y="-22" width="150" height="44" rx="22" transform="translate(115 92) rotate(-42)"/>
          </g>
          <g class="run">
            <rect pathLength="1" x="-75" y="-22" width="150" height="44" rx="22" transform="translate(65 48) rotate(-42)"/>
            <rect pathLength="1" x="-75" y="-22" width="150" height="44" rx="22" transform="translate(115 92) rotate(-42)"/>
          </g>
        </svg>
        <i class="ring"></i><i class="ring r2"></i>
      </div>
      <div class="word" aria-hidden="true"><div class="wi"><span>v</span><span>e</span><span>r</span><span>o</span></div></div>
    </div>
    <div class="load"><i></i></div>
  </div>

  <main class="screen">

    <!-- Balance -->
    <section class="balance">
      <h1 class="balance-amount money"><span class="cur">$</span>2,258<span class="cents">.93</span></h1>
      <div class="change-pill">
        <span class="up">+7.87%</span>
        <span class="dot">·</span>
        <span>Today</span>
      </div>
    </section>

    <!-- Quick actions -->
    <section class="actions">
      <button class="action">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 20V5M7.5 5L3.8 8.8M7.5 5l3.7 3.8M16.5 4v15M16.5 19l-3.7-3.8M16.5 19l3.7-3.8"/></svg>
        <span>Transfer</span>
      </button>
      <button class="action">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11V9.5A3.5 3.5 0 0 1 8 6h11.5M16.5 2.8l3.2 3.2-3.2 3.2M19.5 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4.5M7.5 14.8L4.3 18l3.2 3.2"/></svg>
        <span>Swap</span>
      </button>
      <button class="action">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>
        <span>Buy</span>
      </button>
    </section>

    <!-- In-app promotion -->
    <section class="promo" aria-label="Promotion">
      <div class="promo-text">
        <div class="promo-tag">Offer</div>
        <div class="promo-title">Earn 5% back</div>
        <div class="promo-desc">Get cashback on your first card purchase this week.</div>
        <button class="promo-btn">Learn more</button>
      </div>
      <div class="promo-art">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <polygon points="100,172 165,138 180,149 114,185" fill="#1a0f5c"/>
          <polygon points="48,72 85,98 100,172 62,150" fill="#8585dc" stroke="#1a0f5c" stroke-width="1.2"/>
          <polygon points="85,98 142,66 165,138 100,172" fill="#9393ea" stroke="#1a0f5c" stroke-width="1.2"/>
          <polygon points="48,72 112,40 142,66 85,98" fill="#1a0f5c"/>
          <path d="M111,92 L119,146 Q122,162 138,152 Q153,142 147,112 L141,78" stroke="#1a0f5c" stroke-width="8" stroke-linecap="round" transform="translate(2.5,3)"/>
          <path d="M111,92 L119,146 Q122,162 138,152 Q153,142 147,112 L141,78" stroke="#b9f0cc" stroke-width="7" stroke-linecap="round"/>
          <g transform="rotate(-20 88 38)">
            <ellipse cx="88" cy="45" rx="24" ry="22" fill="#8585dc" stroke="#1a0f5c" stroke-width="1.2"/>
            <ellipse cx="88" cy="38" rx="24" ry="22" fill="#ff8a1f" stroke="#1a0f5c" stroke-width="1.2"/>
            <ellipse cx="88" cy="38" rx="17" ry="15" stroke="#ffd2a1" stroke-width="1.5"/>
            <text x="88" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="Arial, sans-serif">$</text>
          </g>
          <g transform="translate(20,114) rotate(-20) skewX(-10)">
            <rect width="68" height="44" rx="7" fill="#bdf0cf" stroke="#1a0f5c" stroke-width="1.2"/>
            <rect y="13" width="68" height="9" fill="#1a0f5c"/>
            <polygon points="52,27 57,30 57,36 52,39 47,36 47,30" fill="#ff8a1f" stroke="#1a0f5c" stroke-width="1.2"/>
          </g>
        </svg>
      </div>
    </section>

    <!-- Segmented control -->
    <div class="seg" id="seg">
      <button class="seg-btn active" data-tab="assets">Assets</button>
      <button class="seg-btn" data-tab="accounts">Accounts</button>
    </div>

    <!-- Assets -->
    <section id="assets" class="list">
      <div class="row">
        <div class="coin btc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.6h4.2a2.5 2.5 0 0 1 0 5H9m0 0h4.9a2.75 2.75 0 0 1 0 5.5H9V6.6zM11 4.4v2.2M14 4.4v2.2M11 17.1v2.3M14 17.1v2.3"/></svg>
        </div>
        <div class="meta">
          <div class="name">Bitcoin</div>
          <div class="sub money">0.000023 BTC</div>
        </div>
        <div class="val">
          <div class="name money">$0.00</div>
          <div class="sub up">+7.87%</div>
        </div>
      </div>

      <div class="row">
        <div class="coin eth">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l-5.3 8.6L12 15.3l5.3-3.1z"/><path d="M12 17l-5.3-3.1L12 20.4l5.3-6.5z"/></svg>
        </div>
        <div class="meta">
          <div class="name">Ethereum</div>
          <div class="sub money">0.45 ETH</div>
        </div>
        <div class="val">
          <div class="name money">$1,858.08</div>
          <div class="sub up">+12.32%</div>
        </div>
      </div>
    </section>

    <!-- Accounts -->
    <section id="accounts" class="list hidden">
      <div class="empty">No linked accounts yet.</div>
    </section>

  </main>

  <!-- Liquid glass nav -->
  <nav class="nav" aria-label="Main">
    <div class="nav-glass">
      <button class="nav-btn active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" fill-rule="evenodd" d="M12 3.2c.7 0 1.3.2 1.8.7l5 4.4c.8.6 1.2 1.5 1.2 2.4v6.8a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 17.5v-6.8c0-.9.4-1.8 1.2-2.4l5-4.4c.5-.5 1.1-.7 1.8-.7zM9.5 14a.9.9 0 0 0 .9.9h3.2a.9.9 0 0 0 0-1.8h-3.2a.9.9 0 0 0-.9.9z"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M9.6 7.8h3.3a2 2 0 0 1 0 4H9.6m0 0h3.6a2.1 2.1 0 0 1 0 4.2H9.6V7.8zM11 6.4v1.4M13.3 6.4v1.4M11 16v1.4M13.3 16v1.4"/></svg>
        <span>Crypto</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2V5.5a2 2 0 0 1 2-2h5.7a2 2 0 0 1 1.4.6l7.3 7.3a2 2 0 0 1 0 2.8l-5.7 5.7a2 2 0 0 1-2.8 0l-7.3-7.3a2 2 0 0 1-.6-1.4z"/><circle cx="8.6" cy="8.6" r="1.2"/></svg>
        <span>Pay Bill</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.9" y="5" width="18.2" height="14" rx="4.4"/><path d="M3 10.2h18M7 15h3"/></svg>
        <span>Cards</span>
      </button>
    </div>
  </nav>

</div>
<script src="script.js"></script>
</body>
</html>
